<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basurero Inteligente</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap');

        body {
            font-family: 'Roboto', sans-serif;
            background: #1e1e1e;
            color: #f5f5f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #00bcd4;
            text-shadow: 0 0 10px rgba(0, 188, 212, 0.7);
            margin-bottom: 20px;
        }

        .data {
            background: #333;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            text-align: center; /* Centrar el texto */
            width: 60%; /* Reducir el ancho para centrar mejor */
        }

        .charts-container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            width: 80%;
        }

        .chart-container {
            background: #333;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            margin-bottom: 40px;
            width: 45%;
        }

        canvas {
            width: 100% !important;
            height: auto !important;
        }

        .trash-bin {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 100px;
            height: 200px;
            border: 2px solid #00bcd4;
            border-radius: 10px;
            overflow: hidden;
            background: #1e1e1e;
            box-shadow: 0 0 10px rgba(0, 188, 212, 0.5);
        }

        .trash-fill {
            width: 100%;
            height: 0;
            background: green;
            transition: height 0.3s;
            position: absolute;
            bottom: 0;
        }

        p {
            margin: 10px 0;
        }

        @media (max-width: 768px) {
            .charts-container {
                flex-direction: column;
                align-items: center;
            }

            .chart-container {
                width: 80%;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <script src="scripts/chart.js"></script>
</head>
<body>
    <h1>Basurero Inteligente</h1>
    <div class="data">
        <p id="person-distance">Distancia: Loading...</p>
        <p id="trash-distance"></p>
        <p id="open-trash-count">N° Tacho Abierto: Loading...</p>
        <p id="trash-fill-percentage">Trash Fill Percentage: Loading...</p>
    </div>
    <div class="trash-bin">
        <div id="trash-fill" class="trash-fill"></div>
    </div>
    <div class="charts-container">
        <div class="chart-container">
            <canvas id="open-trash-chart"></canvas>
        </div>
        <div class="chart-container">
            <canvas id="trash-chart"></canvas>
        </div>
    </div>
</body>
</html>
